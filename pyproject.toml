[project]
name = "wattsplit"
version = "0.1.0"
description = "Estimate per-appliance power and on/off state in Home Assistant from a single whole-house power signal"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
