[project]
name = "wattsplit"
version = "0.5.0"
description = "Estimate per-appliance power and on/off state in Home Assistant from a single whole-house power signal"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "B007", "E741", "E731"]  # long lines in prose strings and tests; style choices
